# KI Features Identification Workflow
#
# On-demand workflow that identifies KI features for a single stream.
# Inferred extraction runs as one KI Feature Extractor agent conversation
# (the agent samples, converges, and persists). Computed features stay on HTTP.
#
# Flow:
#   extract_features (ai.agent) → snapshot → identify_computed → output
#
# Concurrency is keyed per stream so only one identification run can be active
# for a given stream at any time; overlapping triggers are dropped.

version: "1"
name: "KI Features Identification"
enabled: true
description: "Identifies KI features in a stream using the KI Feature Extractor agent and computed KI features."
tags:
  - observability
  - streams
  - knowledge-indicators
  - features-identification
settings:
  timeout: "15m"
  concurrency:
    key: "streams-ki-features-identification-{{ inputs.streamName }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      - name: streamName
        type: string
        required: true
        description: "Target stream name to identify KI features for."
      - name: start
        type: number
        description: "Start timestamp (epoch ms) for the document sampling window. Defaults to 24 h ago."
      - name: end
        type: number
        description: "End timestamp (epoch ms) for the document sampling window. Defaults to now."
      - name: connectorId
        type: string
        description: "Override connector ID for LLM inference. Unused by the agent step (connector is resolved via the Inference Feature Registry)."
      - name: maxIterations
        type: number
        default: 5
        description: "Maximum number of LLM sampling iterations."
      - name: convergencePatience
        type: number
        default: 2
        description: "Stop the loop after this many healthy-successful passes without a new feature (degraded iterations are neutral and not counted)."
      - name: sampleSize
        type: number
        description: "Number of documents sampled per iteration."
      - name: featureTtlDays
        type: number
        description: "Number of days before a KI feature expires and is cleaned up."
      - name: entityFilteredRatio
        type: number
        description: "Fraction (0–1) of sample allocated to entity-filtered (must_not) documents."
      - name: diverseRatio
        type: number
        description: "Fraction (0–1) of sample allocated to diverse (unfiltered) documents."
      - name: maxExcludedFeaturesInPrompt
        type: number
        description: "Maximum number of excluded KI features sent in the LLM prompt."
      - name: maxEntityFilters
        type: number
        description: "Maximum number of entity filters applied during sampling."
      - name: maxPreviouslyIdentifiedFeatures
        type: number
        description: "Maximum number of previously identified features sent in the LLM prompt."
steps:
  # -----------------------------------------------------------------------
  # Step 1: Extract inferred features via the KI Feature Extractor agent.
  # -----------------------------------------------------------------------
  - name: extract_features
    type: ai.agent
    agent-id: "significant-events.ki-extraction"
    # Keep connector-id-by-feature/plugin-id/aggregate-by in sync with @kbn/significant-events-schema
    # inference_feature_ids.ts (SIGNIFICANT_EVENTS_KI_EXTRACTION_INFERENCE_FEATURE_ID /
    # SIGNIFICANT_EVENTS_INFERENCE_PARENT_FEATURE_ID).
    connector-id-by-feature: 'significant_events_ki_extraction'
    plugin-id: 'significant_events_ki_extraction'
    aggregate-by: 'significant_events'
    create-conversation: true
    public-conversation: true
    timeout: 720s
    with:
      message: |
        Extract Knowledge Indicator features for stream `{{ inputs.streamName }}`.

        run_id: {{ execution.id }}
        start: {{ inputs.start }}
        end: {{ inputs.end }}
        maxIterations: {{ inputs.maxIterations }}
        convergencePatience: {{ inputs.convergencePatience }}
        sampleSize: {{ inputs.sampleSize }}
        entityFilteredRatio: {{ inputs.entityFilteredRatio }}
        diverseRatio: {{ inputs.diverseRatio }}
        maxEntityFilters: {{ inputs.maxEntityFilters }}
        maxExcludedFeaturesInPrompt: {{ inputs.maxExcludedFeaturesInPrompt }}
        maxPreviouslyIdentifiedFeatures: {{ inputs.maxPreviouslyIdentifiedFeatures }}

        Sample with platform.sig_events.ki_sample_documents, persist with
        platform.sig_events.ki_feature_persist, and stop when there are no documents
        or after convergencePatience barren successes.
      schema:
        type: object
        properties:
          discoveredFeatures:
            type: array
            description: Features persisted during this extraction run (id + title).
            items:
              type: object
              properties:
                id:
                  type: string
                title:
                  type: string
              required: [id]
          hasDocuments:
            type: boolean
            description: false when sampling returned no documents.
        required: [discoveredFeatures]
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential

  # -----------------------------------------------------------------------
  # Eviction-safe snapshot — ai.agent outputs are evictable; data.set outputs are not.
  # -----------------------------------------------------------------------
  - name: snapshot_extract_output
    type: data.set
    with:
      discoveredFeatures: "${{ steps.extract_features.output.structured_output.discoveredFeatures | default: [] }}"
      connectorId: "${{ steps.extract_features.output.metadata.usage.connectorId | default: inputs.connectorId }}"
      tokensUsed:
        prompt: "${{ steps.extract_features.output.metadata.usage.inputTokens | default: 0 }}"
        completion: "${{ steps.extract_features.output.metadata.usage.outputTokens | default: 0 }}"
        total: "${{ steps.extract_features.output.metadata.usage.totalTokens | default: 0 }}"
        cached: "${{ steps.extract_features.output.metadata.usage.cachedTokens | default: 0 }}"

  # -----------------------------------------------------------------------
  # Step 2: Identify computed features.
  #         Computed features are supplementary; failure here should not
  #         block the workflow, so we continue on error.
  # -----------------------------------------------------------------------
  - name: identify_computed
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: "/internal/streams/{{ inputs.streamName }}/features/_identify/computed"
      headers:
        x-elastic-internal-origin: "kibana"
      body:
        start: "${{ inputs.start }}"
        end: "${{ inputs.end }}"
        runId: "${{ execution.id }}"
        featureTtlDays: "${{ inputs.featureTtlDays }}"

  # -----------------------------------------------------------------------
  # Step 3: Output results.
  # -----------------------------------------------------------------------
  - name: output_result
    type: workflow.output
    with:
      streamName: "${{ inputs.streamName }}"
      connectorId: "${{ variables.connectorId }}"
      discoveredFeatures: "${{ variables.discoveredFeatures }}"
      computedFeaturesCount: "${{ steps.identify_computed.output.computedFeaturesCount }}"
      tokensUsed: "${{ variables.tokensUsed }}"
